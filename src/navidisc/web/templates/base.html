<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Navidisc{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    
    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        surface: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    
    <!-- Alpine.js for some interactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
        /* Custom styles */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
        
        /* Smooth transitions */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Disc icon animation */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 3s linear infinite;
        }
        
        /* Progress bar animation */
        .progress-bar {
            transition: width 0.3s ease-in-out;
        }
    </style>
</head>
<body class="h-full bg-surface-100 dark:bg-surface-900 text-surface-900 dark:text-surface-50">
    <div class="min-h-full">
        <!-- Navigation -->
        <nav class="bg-white dark:bg-surface-800 shadow-sm border-b border-surface-200 dark:border-surface-700">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex">
                        <!-- Logo -->
                        <a href="/" class="flex items-center">
                            <svg class="h-8 w-8 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <circle cx="12" cy="12" r="10" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3" stroke-width="2"/>
                                <circle cx="12" cy="12" r="6" stroke-width="1" stroke-dasharray="2 2"/>
                            </svg>
                            <span class="ml-2 text-xl font-bold text-primary-600">Navidisc</span>
                        </a>
                        
                        <!-- Navigation Links -->
                        <div class="hidden sm:ml-8 sm:flex sm:space-x-4">
                            <a href="/" 
                               class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-md
                                      {% if request.url.path == '/' %}
                                      text-primary-700 bg-primary-50 dark:bg-primary-900/50 dark:text-primary-300
                                      {% else %}
                                      text-surface-600 hover:text-surface-900 hover:bg-surface-100
                                      dark:text-surface-300 dark:hover:text-white dark:hover:bg-surface-700
                                      {% endif %}">
                                <svg class="mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                                </svg>
                                Home
                            </a>
                            <a href="/playlists"
                               class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-md
                                      {% if '/playlists' in request.url.path %}
                                      text-primary-700 bg-primary-50 dark:bg-primary-900/50 dark:text-primary-300
                                      {% else %}
                                      text-surface-600 hover:text-surface-900 hover:bg-surface-100
                                      dark:text-surface-300 dark:hover:text-white dark:hover:bg-surface-700
                                      {% endif %}">
                                <svg class="mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                                </svg>
                                Playlists
                            </a>
                            <a href="/settings"
                               class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-md
                                      {% if '/settings' in request.url.path %}
                                      text-primary-700 bg-primary-50 dark:bg-primary-900/50 dark:text-primary-300
                                      {% else %}
                                      text-surface-600 hover:text-surface-900 hover:bg-surface-100
                                      dark:text-surface-300 dark:hover:text-white dark:hover:bg-surface-700
                                      {% endif %}">
                                <svg class="mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                                Settings
                            </a>
                        </div>
                    </div>
                    
                    <!-- Status indicator -->
                    <div class="flex items-center">
                        {% if has_config %}
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200">
                            <span class="w-2 h-2 mr-1.5 rounded-full bg-green-500"></span>
                            Connected
                        </span>
                        {% else %}
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200">
                            <span class="w-2 h-2 mr-1.5 rounded-full bg-yellow-500"></span>
                            Not Configured
                        </span>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main content -->
        <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </main>
        
        <!-- Footer -->
        <footer class="bg-white dark:bg-surface-800 border-t border-surface-200 dark:border-surface-700 mt-auto">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
                <p class="text-center text-sm text-surface-500">
                    Navidisc — Burn your Navidrome playlists to disc
                </p>
                <p class="text-center text-xs text-surface-400 mt-1">
                    © 2026 Will Bates. All rights reserved.
                </p>
            </div>
        </footer>
    </div>
    
    <!-- Toast notifications container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>
    
    <script>
        // Toast notification helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const colors = {
                'success': 'bg-green-500',
                'error': 'bg-red-500',
                'info': 'bg-blue-500',
                'warning': 'bg-yellow-500'
            };
            
            const toast = document.createElement('div');
            toast.className = `${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg fade-in`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }
        
        // Handle htmx events
        document.body.addEventListener('htmx:afterSwap', function(event) {
            // Add fade-in animation to swapped content
            if (event.detail.target) {
                event.detail.target.classList.add('fade-in');
            }
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
