<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="discGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Outer disc -->
  <circle cx="50" cy="50" r="45" fill="url(#discGradient)" />
  
  <!-- Disc rings -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.5" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.4" />
  <circle cx="50" cy="50" r="22" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.3" />
  
  <!-- Center hole -->
  <circle cx="50" cy="50" r="12" fill="#1e3a8a" />
  <circle cx="50" cy="50" r="8" fill="#0f172a" />
  
  <!-- Shine effect -->
  <ellipse cx="35" cy="35" rx="20" ry="15" fill="url(#shineGradient)" transform="rotate(-30 35 35)" />
</svg>
